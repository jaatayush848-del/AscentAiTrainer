name: Build Android APK

# Produces an installable release APK without needing Android Studio or the
# Android SDK on your own machine: everything runs on GitHub's runners.
#
#   Actions tab -> "Build Android APK" -> Run workflow
#
# Download the APK from the run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate icons and splash
        run: npm run assets

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ascent-ai-trainer-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
